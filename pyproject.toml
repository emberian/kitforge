[project]
name = "kitforge"
version = "0.1.0"
description = "turn sample packs into kits Claudes can compose with: ingest, analyze, render, critique"
authors = [
    { name = "ember arlynx", email = "ember@lunar.town" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mido>=1.3.3",
    "numpy>=2.5.3",
    "pedalboard>=0.9.25",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
